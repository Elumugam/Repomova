name: Bug Report
description: Create a report to help us improve Repomova
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much relevant information as possible.
        **Do not include any secrets, passwords, or personal access tokens in this issue.**
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open the Repomova dashboard
        2. Click on ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened, including any console errors or screenshots.
      placeholder: Error traces, screenshots, or logs...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: Details about your environment.
      value: |
        - OS: [e.g. Windows 11, macOS Sequoia, Ubuntu 24.04]
        - Browser: [e.g. Chrome 130, Firefox 131, Safari 18]
        - Node.js Version: [e.g. v20.18.0, v22.17.0]
        - Repomova Version / Commit: [e.g. main branch, commit 7ba3736]
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I have searched existing issues and confirmed this is not a duplicate.
          required: true
        - label: I have confirmed that no secrets, credentials, or private keys are included in this report.
          required: true
